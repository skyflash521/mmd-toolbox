[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-toolbox"
version = "0.0.1"
description = "MikuMikuDance 向けユーティリティツール群"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mocapvmd = "mocapvmd.cli:main"
shakevmd = "shakevmd.cli:main"
sparsevmd = "sparsevmd.cli:main"

[tool.setuptools.packages.find]
include = ["mmd_toolbox*", "lipsync*", "mocapvmd*", "shakevmd*", "sparsevmd*", "vpr_io*"]

[tool.pytest.ini_options]
testpaths = ["mmd_toolbox", "lipsync", "mocapvmd", "shakevmd", "sparsevmd", "vpr2vmd", "vpr_io"]
pythonpath = ["."]
# 各ツールの tests に同名テストファイル(test_cli.py 等)があるため、basename 衝突を
# 避ける importlib インポートモードを使う(prepend 既定だと collection で衝突する)。
addopts = "--import-mode=importlib"
