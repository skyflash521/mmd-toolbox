[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-toolbox"
version = "2026.6.29"
description = "MikuMikuDance 向けユーティリティツール群"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mocapvmd = "mocapvmd.cli:main"
shakevmd = "shakevmd.cli:main"
sparsevmd = "sparsevmd.cli:main"
vpr2vmd = "vpr2vmd.cli:main"

[tool.setuptools.packages.find]
where = ["libs", "tools"]
include = ["vmd*", "pmx*", "vpr*", "lipsync*", "mocapvmd*", "shakevmd*", "sparsevmd*", "vpr2vmd*"]

[tool.pytest.ini_options]
testpaths = ["libs/cli_events", "libs/vmd", "libs/pmx", "libs/vpr", "libs/lipsync", "tools/mocapvmd", "tools/shakevmd", "tools/sparsevmd", "tools/vpr2vmd"]
pythonpath = ["libs", "tools"]
# 各ツールの tests に同名テストファイル(test_cli.py 等)があるため、basename 衝突を
# 避ける importlib インポートモードを使う(prepend 既定だと collection で衝突する)。
addopts = "--import-mode=importlib"
