[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-toolbox"
version = "2026.8.8"
description = "MikuMikuDance 向けユーティリティツール群"
requires-python = ">=3.12"
dependencies = [
    "numpy<3",
    "scipy<2",
]

[project.optional-dependencies]
dev = [
    "pytest<10",
    # ruff は 0.x のマイナー更新で規則の追加・既定の変更が入る。
    "ruff<0.17",
    # rumdl も 0.x のマイナー更新で規則の追加・既定の変更が入る。
    "rumdl<0.3",
    "soundfile<1",
]
vocal-analysis = [
    "soundfile<1",
    "audio-separator",
    # audio-separator は onnxruntime を無条件に import するが、依存としては extras(cpu/gpu/dml)の下でしか要求しない。
    "onnxruntime<2",
    "torch<3",
    # transformers は 4.56 で数値精度の引数名が torch_dtype から dtype へ変わった。
    "transformers>=4.56,<6",
    "huggingface-hub<2",
    "tqdm<5",
    "librosa<1",
    "pyopenjtalk-plus<1",
    "nltk<4",
    "arpakana<1",
    "psutil<8",
]

[project.scripts]
mocapvmd = "mocapvmd.cli:main"
shakevmd = "shakevmd.cli:main"
song2vmd = "song2vmd.cli:main"
song2vpr = "song2vpr.cli:main"
sparsevmd = "sparsevmd.cli:main"
vpr2vmd = "vpr2vmd.cli:main"

[tool.setuptools.packages.find]
where = ["libs", "tools"]
include = ["cli_events*", "cli_options*", "cli_progress*", "cli_progress_router*",
           "cli_resource_watch*", "lipsync*", "pmx*", "vmd*", "vocal_analysis*",
           "vocal_analysis_cli*", "vpr*",
           "mocapvmd*", "shakevmd*", "song2vmd*", "song2vpr*", "sparsevmd*", "vpr2vmd*"]

[tool.ruff]
line-length = 120
# ruff の src の既定はプロジェクトルートと src で、それ以外に置いたモジュールはファーストパーティと判定されない。
src = ["libs", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "B", "I", "NPY", "TID", "RUF100", "PLE"]

[tool.ruff.lint.per-file-ignores]
"libs/lipsync/types.py" = ["E741"]
"tools/mocapvmd/pose_fit.py" = ["B023"]
"tools/mocapvmd/tests/test_reduce.py" = ["B023"]
"**/tests/*" = ["E402"]

[tool.rumdl]
# rumdl の MD038 の自動修正はコードスパン内の空白を落とす。
# rumdl の MD051 は見出しがインラインリンクを含むとアンカーを誤って算出する。
disable = ["MD013", "MD038", "MD051"]

[tool.pytest.ini_options]
testpaths = ["libs/cli_events", "libs/cli_options", "libs/cli_progress",
             "libs/cli_progress_router", "libs/cli_resource_watch", "libs/lipsync", "libs/pmx", "libs/vmd",
             "libs/vocal_analysis", "libs/vocal_analysis_cli", "libs/vpr", "scripts", "tools/mocapvmd", "tools/shakevmd", "tools/song2vmd",
             "tools/song2vpr", "tools/sparsevmd", "tools/vpr2vmd"]
pythonpath = ["libs", "tools", "scripts"]
# pytest の既定の prepend インポートモードは、別ディレクトリの同名テストファイルを collection で衝突させる。
addopts = "--import-mode=importlib"
